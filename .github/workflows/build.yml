name: Build GrabVid APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Download & Setup Binaries Automatically
        run: |
          BASE_DIR="app/src/main/assets/bin"
          mkdir -p $BASE_DIR/arm64-v8a $BASE_DIR/armeabi-v7a $BASE_DIR/x86_64 $BASE_DIR/x86

          echo "1. جاري تحميل yt-dlp لجميع المعماريات..."
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64 -o $BASE_DIR/arm64-v8a/yt-dlp
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_armv7l -o $BASE_DIR/armeabi-v7a/yt-dlp
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o $BASE_DIR/x86_64/yt-dlp
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_x86 -o $BASE_DIR/x86/yt-dlp

          echo "2. جاري تحميل FFmpeg للأندرويد..."
          # سحب نسخ FFmpeg الجاهزة لبيئة Android NDK
          FFMPEG_VER="v4.4"
          curl -sL "https://github.com/KRTirtho/spotube/releases/download/v3.0.0/ffmpeg-arm64-v8a" -o $BASE_DIR/arm64-v8a/ffmpeg
          curl -sL "https://github.com/KRTirtho/spotube/releases/download/v3.0.0/ffmpeg-armeabi-v7a" -o $BASE_DIR/armeabi-v7a/ffmpeg
          curl -sL "https://github.com/KRTirtho/spotube/releases/download/v3.0.0/ffmpeg-x86_64" -o $BASE_DIR/x86_64/ffmpeg
          curl -sL "https://github.com/KRTirtho/spotube/releases/download/v3.0.0/ffmpeg-x86" -o $BASE_DIR/x86/ffmpeg

          echo "3. جاري تحميل PHP المترجم للأندرويد..."
          # سحب ثنائيات PHP المستخرجة من حزم Termux للأندرويد
          PHP_URL="https://github.com/termux/termux-packages/releases/download/bootstrap-2024.01.12-r1"
          
          # إعداد مجلدات مؤقتة لاستخراج PHP
          mkdir -p /tmp/php_extract
          
          # ARM64
          curl -sL "$PHP_URL/bootstrap-aarch64.zip" -o /tmp/php_extract/arm64.zip
          unzip -q /tmp/php_extract/arm64.zip -d /tmp/php_extract/arm64
          cp /tmp/php_extract/arm64/bin/php $BASE_DIR/arm64-v8a/php

          # ARMv7
          curl -sL "$PHP_URL/bootstrap-arm.zip" -o /tmp/php_extract/arm.zip
          unzip -q /tmp/php_extract/arm.zip -d /tmp/php_extract/arm
          cp /tmp/php_extract/arm/bin/php $BASE_DIR/armeabi-v7a/php

          # x86_64
          curl -sL "$PHP_URL/bootstrap-x86_64.zip" -o /tmp/php_extract/x86_64.zip
          unzip -q /tmp/php_extract/x86_64.zip -d /tmp/php_extract/x86_64
          cp /tmp/php_extract/x86_64/bin/php $BASE_DIR/x86_64/php

          # x86
          curl -sL "$PHP_URL/bootstrap-i686.zip" -o /tmp/php_extract/x86.zip
          unzip -q /tmp/php_extract/x86.zip -d /tmp/php_extract/x86
          cp /tmp/php_extract/x86/bin/php $BASE_DIR/x86/php

          echo "4. إعطاء صلاحيات التنفيذ الشاملة..."
          chmod -R 775 $BASE_DIR/

      - name: Build Release APKs
        run: ./gradlew assembleRelease

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GrabVid-APKs
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
