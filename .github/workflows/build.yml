      - name: Download & Setup Binaries Automatically
        run: |
          BASE_DIR="app/src/main/assets/bin"
          mkdir -p $BASE_DIR/arm64-v8a $BASE_DIR/armeabi-v7a $BASE_DIR/x86_64 $BASE_DIR/x86

          echo "1. جاري تحميل yt-dlp لجميع المعماريات..."
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_aarch64 -o $BASE_DIR/arm64-v8a/yt-dlp
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_armv7l -o $BASE_DIR/armeabi-v7a/yt-dlp
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o $BASE_DIR/x86_64/yt-dlp
          curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux_x86 -o $BASE_DIR/x86/yt-dlp

          echo "2. جاري تحميل FFmpeg للأندرويد..."
          curl -sL "https://github.com/KRTirtho/spotube/releases/download/v3.0.0/ffmpeg-arm64-v8a" -o $BASE_DIR/arm64-v8a/ffmpeg
          curl -sL "https://github.com/KRTirtho/spotube/releases/download/v3.0.0/ffmpeg-armeabi-v7a" -o $BASE_DIR/armeabi-v7a/ffmpeg
          curl -sL "https://github.com/KRTirtho/spotube/releases/download/v3.0.0/ffmpeg-x86_64" -o $BASE_DIR/x86_64/ffmpeg
          curl -sL "https://github.com/KRTirtho/spotube/releases/download/v3.0.0/ffmpeg-x86" -o $BASE_DIR/x86/ffmpeg

          echo "3. جاري تهيئة ملفات PHP..."
          # نظراً لصعوبة إيجاد روابط ثابتة لـ PHP تعمل على الأندرويد بدون انهيار،
          # سننشئ ملفات وهمية حالياً لضمان نجاح استخراج ملف APK، 
          # ويمكنك لاحقاً دمج نسخة PHP Static يدوياً.
          touch $BASE_DIR/arm64-v8a/php
          touch $BASE_DIR/armeabi-v7a/php
          touch $BASE_DIR/x86_64/php
          touch $BASE_DIR/x86/php

          echo "4. إعطاء صلاحيات التنفيذ الشاملة..."
          chmod -R 775 $BASE_DIR/
